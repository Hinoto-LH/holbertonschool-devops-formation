# Reverse proxy: the single entry point of the whole stack.
# It owns no content — it only decides which internal service answers.

server {
    listen 80;

    # Everything that is not /api goes to the static front.
    location / {
        proxy_pass http://web:80;

        # Without these, the backend only ever sees the proxy: same Host for
        # every request, and the proxy's IP as the client IP.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /api/* goes to the API. No trailing slash on proxy_pass, so the /api
    # prefix is kept and the API sees the URI it declares its routes with.
    location /api/ {
        proxy_pass http://api:3000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
