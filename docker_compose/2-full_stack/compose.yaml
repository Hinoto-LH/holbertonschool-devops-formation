# Five services, one door. Only `proxy` publishes a port; everything else is
# reachable by service name on the network Compose creates.

services:

  # ── Reverse proxy: the single entry point ─────────────────────────────────
  proxy:
    image: nginx:alpine
    ports:
      - "8080:80"                 # the ONLY published port of the stack
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_healthy

  # ── Static front ──────────────────────────────────────────────────────────
  web:
    image: nginx:alpine
    volumes:
      - ./web/index.html:/usr/share/nginx/html/index.html:ro

  # ── API: reads the cache first, falls back to the database ────────────────
  api:
    build: ./api
    environment:
      DB_HOST: db                 # service names, resolved by Compose DNS
      CACHE_HOST: cache
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost: the app binds to 0.0.0.0 (IPv4 only) while
      # `localhost` also resolves to ::1, which BusyBox wget tries first.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 3s

  # ── Cache ─────────────────────────────────────────────────────────────────
  cache:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]   # answers PONG once Redis is ready
      interval: 2s
      timeout: 3s
      retries: 10
    # No volume on purpose: a cache is disposable by definition. Losing it
    # costs one slow request, not data.

  # ── Database ──────────────────────────────────────────────────────────────
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

volumes:
  db_data:
