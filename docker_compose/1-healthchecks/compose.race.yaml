# BROKEN ON PURPOSE — used to demonstrate the race this task fixes.
# Same stack, but: no healthcheck on db, and plain `depends_on` on the API.
# Run it with its own project name so it does not collide with the real stack:
#   docker compose -p race -f compose.race.yaml up

services:

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # no healthcheck: Docker has no idea whether Postgres is ready

  api:
    build: ./api
    environment:
      DB_HOST: db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    depends_on:
      - db        # waits for the CONTAINER to start, not for Postgres to be READY
