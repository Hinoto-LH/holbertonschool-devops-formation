server {
    listen 80;

    # Static page served by nginx itself.
    location / {
        root  /usr/share/nginx/html;
        index index.html;
    }

    # Anything under /api is forwarded to the api service.
    # "api" is the service name from compose.yaml, resolved by Compose's
    # internal DNS; 3000 is the port the API listens on inside the network.
    location /api {
        proxy_pass http://api:3000;
    }
}
