# Three services, one file. `docker compose up` starts all of them.
# No `version:` key: it is obsolete in Compose v2 and only produces a warning.

services:

  # ── Database ───────────────────────────────────────────────────────────────
  db:
    image: postgres:17-alpine          # pulled from Docker Hub, nothing to build
    environment:                       # values come from the .env file
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data   # named volume: data survives `down`
    healthcheck:
      # `$$` escapes the dollar so Compose leaves it for the container's shell.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── API ────────────────────────────────────────────────────────────────────
  api:
    build: ./api                       # built from our own Dockerfile
    environment:
      DB_HOST: db                      # the service name above, resolved by DNS
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy     # wait until Postgres ACCEPTS QUERIES
    healthcheck:
      # 127.0.0.1 and not localhost: the app binds to 0.0.0.0 (IPv4 only),
      # while `localhost` also resolves to ::1, which BusyBox wget tries first.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    # No `ports:` — the API is only reachable from inside the stack.

  # ── Web front ──────────────────────────────────────────────────────────────
  web:
    image: nginx:alpine
    ports:
      - "8080:80"                      # the ONLY port published to the host
    volumes:                           # bind mounts, read-only
      - ./web/index.html:/usr/share/nginx/html/index.html:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  db_data:                             # declares the named volume used above
