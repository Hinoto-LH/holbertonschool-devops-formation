services:
  db:
    image: postgres:16
    environment:
      # Postgres refuses to initialise without this. The value comes from .env,
      # which is gitignored. The healthcheck below probes `-U postgres`, so the
      # default superuser name is kept as-is.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  cache:
    image: redis:7-alpine

  web:
    image: nginx:alpine
    ports:
      - "8080:80"

  api:
    image: nginx:alpine
    ports:
      - "8081:80"
    depends_on:
      - db
